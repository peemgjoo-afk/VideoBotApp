name: Build VideoBot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git ccache \
            libffi-dev libssl-dev build-essential \
            python3-dev python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake gettext \
            libltdl-dev

      - name: Install Buildozer and Fixed Dependencies
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<69.0.0" wheel
          pip install Cython==0.29.36
          pip install buildozer
          pip install git+https://github.com/kivy/python-for-android.git@master

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoBotStudio-APK
          path: bin/*.apk
